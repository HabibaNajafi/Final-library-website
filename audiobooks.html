<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audiobooks — BookNest</title>
<meta name="description" content="Listen to your favorite books anytime, anywhere on BookNest.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bn-page">

<!-- Header / navigation / footer are added separately -->

<main>

  <section class="bn-hero bn-hero--audiobooks">
    <div class="bn-hero-inner">
      <div class="bn-hero-eyebrow"><span class="dot"></span>Audiobooks Collection</div>
      <h1>Stories in Your Ears</h1>
      <p>Listen to your favorite books anytime, anywhere. Discover a world of knowledge and imagination.</p>
      <div class="bn-hero-search">
        <label for="audioSearch" class="bn-visually-hidden">Search audiobooks</label>
        <input type="search" id="audioSearch" placeholder="Search audiobooks...">
        <button type="button" aria-label="Search audiobooks">🔍</button>
      </div>
    </div>
  </section>

  <div class="bn-container">

    <section class="bn-section">
      <div id="audioPlayer" class="bn-player" aria-label="Audiobook player"></div>
    </section>

    <section class="bn-section" style="padding-top:0;">
      <div class="bn-layout">

        <aside class="bn-sidebar" aria-label="Audiobook categories">
          <h3>Categories</h3>
          <nav class="bn-cat-list" id="audioCategoryList"></nav>

          <h3 style="margin-top:22px;">Your Playlist</h3>
          <div id="playlistSection" style="display:flex; flex-direction:column; gap:8px;"></div>

          <h3 style="margin-top:22px;">Recently Played</h3>
          <div id="recentlyPlayed" style="display:flex; flex-direction:column; gap:8px;"></div>
        </aside>

        <div>
          <div class="bn-section-head">
            <h2>Popular Audiobooks</h2>
          </div>
          <div class="bn-toolbar">
            <p class="bn-result-count" id="audioCount" aria-live="polite"></p>
            <div class="bn-sort">
              <label for="audioSort">Sort by</label>
              <select id="audioSort">
                <option value="default">Featured</option>
                <option value="title-asc">Title (A–Z)</option>
                <option value="rating-desc">Highest Rated</option>
                <option value="duration-asc">Shortest First</option>
              </select>
            </div>
          </div>
          <div class="bn-grid" id="audiobooksGrid" aria-live="polite"></div>
          <nav class="bn-pagination" id="audioPagination" aria-label="Audiobooks pagination"></nav>
        </div>

      </div>
    </section>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
