<head>

<body>
    <main class="auto-container">
        <section class="auto-box">
            <div class="forms-container">
                <!-- login form -->
                 <div class="form login-form">
                    <div class = "form-content">
                        <span class="form-icon"></span>
                        <h1>welcom to BookNest</h1>
                        <p class="form-subtitle">login browes your faviourt books</p>

                        <!-- form -->
                         <form id="loginform">

                                <input type="email" id="loginEmail"placeholder = "Enter your email" required>
                            </div>
                            <div class="input-group">
                                <label>Password</label>
                                <input type="password" id="loginPassword" placeholder="Enter your password" required>
                            </div>
                            <button type="submit" class="main-btn">Login</button>

                         </form>

                 </div>
                 <!-- regester -->
                  <div class="form register-fprm">

                        <form id="registerForm">
                            <div class="input-group">
                                <label>Full Name</label>
                                <input type="text" id="registerName" placeholder="Enter your full Name" required>
                            </div>
                            <div class="input-group">
                                <label>Email Address</label>
                                <input type="email" id="registerEmail" placeholder="Enteryour Email" required>
                            </div>
                            <div class="input-group">
                                <label>Confirm Password</label>
                                <input type="password" id="confirmPassword" placeholder="confirm your password" required>
                            </div>
                            <button type="submit" class="main-btn">Create Account</button>
                            <p id="registerMessage" class="message"></p>
                        </form>

                        <p>Already Have an account? 
                            <button id="showLogin">Login</button>
                        </p>
                    </div>
                  </div>
            </div>
            <div class="slider-container">
                <div class="slider-panel">

                         <button class="outlint-btn" id="loginBtn">login</button>
