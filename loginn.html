<html>
    <head>
        <title>My homework</title>
        <link rel="stylesheet" href="register.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="./login.css">
    </head>
    <body>
        <div class="container">
            <input type="radio" name="tab" id="login" checked>
            <input type="radio" name="tab" id="register" >

            <div class="tabs">
                <label for = "login">Login</label>
                <label for = "register">Register</label>

            </div>
            <div class="form-container">
               <!-- Social Icons -->
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-telegram"></i></a>
            </div>

                <!-- Login -->
            <form class="form login-form">
                <input type="text" placeholder="UserName" required>
                <input type="password" placeholder="UserPassword"required>

                <button>Login</button>
                <div class="link"> Forgot Password?</div>
            </form>

                   <!-- Register -->
                <form class="form register-form">
                    <input type="text" placeholder="FullNamae" required>
                    <input type="email" placeholder="Email"required>
                    <input type = "password" placeholder="Password" required>
                    <input type = "tel" placeholder="PhoneNumber" required>

                    <button>Register</button>
                </form>
                <input class="check" type="checkbox" /> Send me an update

            </div>
        </div>
    </body>
</html>
